# client/facts.yaml
#
# Everything on the site that can be checked against reality lives here: names,
# address, phone, hours, prices, sizes. Pages read these values; they never
# retype them. The schema in src/lib/facts.ts validates this file on every build.
#
# Rules
# - Only facts the client confirmed in writing. If a value is unknown, write
#   TODO. In a text field the site still builds and the gate fails on the
#   visible TODO; in a typed field (email, URL, price) the build fails. Either
#   way it cannot reach production.
# - Prices are whole numbers in business.currency.
# - Image paths are relative to src/assets/client/. Alt text describes the photo.
#
# Source: client/notes/2026-10-09-owner-email.md and 2026-10-09-pm-notes.md.

site:
  url: https://demo-resort.zrior.tech
  language: en
  ogLocale: en_US
  aiCrawlers: search-only
  notice: Demo Resort is fictional. This site demonstrates an agency workflow; nothing here can be booked.

business:
  name: Demo Resort
  type: Resort
  description: >-
    Demo Resort is a small resort in Ubud, Bali, with 11 villas, a Balinese and
    Indonesian restaurant and a spa. Breakfast is included with every villa.
  phone: +62 361 000 000
  email: demo-resort@zrior.tech
  address:
    street: Jl. Raya Ubud
    locality: Ubud
    region: Bali
    postalCode: "80571"
    country: ID
  geo: TODO
  mapUrl: TODO
  currency: IDR
  checkIn: "14:00"
  checkOut: "12:00"
  amenities:
    - Breakfast included
    - Outdoor pool
    - Free Wi-Fi
    - Yoga deck with a free class every morning at 07:00
    - Airport transfer on request, IDR 450,000 each way
  sameAs: []
  image:
    src: hero.jpg
    alt: Shaded terrace with a sofa, looking out over rice fields and palm trees

rooms:
  - id: garden-villa
    name: Garden Villa
    sizeSqm: 55
    bed: King
    maxGuests: 2
    priceFrom: 2900000
    features: [Outdoor shower, Terrace facing the garden]
    image:
      src: rooms/garden-villa.jpg
      alt: Bedroom with a white canopy bed under a high timber ceiling and a ceiling fan
  - id: rice-field-villa
    name: Rice Field Villa
    sizeSqm: 70
    bed: King
    maxGuests: 2
    priceFrom: 3800000
    features: [Plunge pool, Bedroom window facing the rice field]
    image:
      src: rooms/rice-field-villa.jpg
      alt: Dim sitting room with an armchair and a window onto green rice fields
  - id: family-pool-villa
    name: Family Pool Villa
    sizeSqm: 140
    bed: One king, one twin
    maxGuests: 4
    priceFrom: 6500000
    features: [Two bedrooms, Private pool, Kitchenette]
    image:
      src: rooms/family-pool-villa.jpg
      alt: Aerial view of a thatched-roof villa with a private pool, surrounded by garden

