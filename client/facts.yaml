faq:
  - q: What time is check-in and check-out?
    a: Check-in is from 14:00 and check-out is until 12:00. TODO confirm the Sunday exception (client wrote 15:00 on Sundays).
  - q: Is breakfast included?
    a: Yes, breakfast is included for all villas.
  - q: Are children welcome?
    a: Yes. Children under 6 stay free in the Family Pool Villa.
  - q: Can I bring my pet?
    a: No, we do not accept pets.
  - q: How far is Ubud centre and the airport?
    a: About 15 minutes by car to Ubud centre and about 1.5 hours to the airport.
  - q: Do you arrange airport transfers?
    a: Yes, on request, for IDR 450,000 each way.
  - q: Can non-guests eat at Demo Kitchen?
    a: Yes, non-guests are welcome. We recommend booking for dinner.
  - q: How quickly do you reply to enquiries?
    a: We reply to every enquiry within one working day.
